<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Seats</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b, #6d28d9, #db2777);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 15px #facc15;
        }

        .subtitle {
            color: #e0e7ff;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .screen {
            width: 80%;
            height: 55px;
            margin: 0 auto 35px;
            background: linear-gradient(90deg, #facc15, #fb7185, #38bdf8);
            border-radius: 0 0 50px 50px;
            color: #111827;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px #facc15;
            letter-spacing: 2px;
        }

        .seat-area {
            display: grid;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .row-label {
            width: 25px;
            font-weight: bold;
            color: #facc15;
        }

        .seat {
            width: 45px;
            height: 45px;
            border-radius: 12px 12px 5px 5px;
            background: linear-gradient(135deg, #22c55e, #86efac);
            color: #052e16;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        .seat:hover {
            transform: scale(1.15);
            background: linear-gradient(135deg, #facc15, #fb923c);
            color: #111827;
        }

        .seat.selected {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            box-shadow: 0 0 20px #38bdf8;
        }

        .seat.booked {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .legend-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .small-seat {
            width: 22px;
            height: 22px;
            border-radius: 6px;
        }

        .available {
            background: #22c55e;
        }

        .selected-box {
            background: #2563eb;
        }

        .booked-box {
            background: #ef4444;
        }

        .summary {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .summary h2 {
            margin-bottom: 10px;
            color: #facc15;
        }

        .price {
            font-size: 22px;
            margin: 12px 0;
            color: #bbf7d0;
            font-weight: bold;
        }

        .btn {
            margin-top: 15px;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #facc15, #fb7185);
            color: #111827;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #facc15;
        }

        @media (max-width: 600px) {
            .seat {
                width: 35px;
                height: 35px;
                font-size: 12px;
            }

            h1 {
                font-size: 30px;
            }

            .screen {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎬 Book Your Seats</h1>
        <p class="subtitle">Choose your favorite seats and enjoy the movie!</p>

        <div class="screen">SCREEN</div>

        <div class="seat-area">

            <div class="row">
                <span class="row-label">A</span>
                <div class="seat">A1</div>
                <div class="seat">A2</div>
                <div class="seat booked">A3</div>
                <div class="seat">A4</div>
                <div class="seat">A5</div>
                <div class="seat">A6</div>
                <div class="seat booked">A7</div>
                <div class="seat">A8</div>
            </div>

            <div class="row">
                <span class="row-label">B</span>
                <div class="seat">B1</div>
                <div class="seat">B2</div>
                <div class="seat">B3</div>
                <div class="seat booked">B4</div>
                <div class="seat">B5</div>
                <div class="seat">B6</div>
                <div class="seat">B7</div>
                <div class="seat">B8</div>
            </div>

            <div class="row">
                <span class="row-label">C</span>
                <div class="seat booked">C1</div>
                <div class="seat">C2</div>
                <div class="seat">C3</div>
                <div class="seat">C4</div>
                <div class="seat">C5</div>
                <div class="seat booked">C6</div>
                <div class="seat">C7</div>
                <div class="seat">C8</div>
            </div>

            <div class="row">
                <span class="row-label">D</span>
                <div class="seat">D1</div>
                <div class="seat">D2</div>
                <div class="seat">D3</div>
                <div class="seat">D4</div>
                <div class="seat">D5</div>
                <div class="seat">D6</div>
                <div class="seat">D7</div>
                <div class="seat booked">D8</div>
            </div>

            <div class="row">
                <span class="row-label">E</span>
                <div class="seat">E1</div>
                <div class="seat">E2</div>
                <div class="seat booked">E3</div>
                <div class="seat">E4</div>
                <div class="seat">E5</div>
                <div class="seat">E6</div>
                <div class="seat">E7</div>
                <div class="seat">E8</div>
            </div>

        </div>

        <div class="legend">
            <div class="legend-box">
                <div class="small-seat available"></div>
                Available
            </div>

            <div class="legend-box">
                <div class="small-seat selected-box"></div>
                Selected
            </div>

            <div class="legend-box">
                <div class="small-seat booked-box"></div>
                Booked
            </div>
        </div>

        <div class="summary">
            <h2>Booking Summary</h2>
            <p>Selected Seats: <span id="selectedSeats">None</span></p>
            <p class="price">Total Price: ₹<span id="totalPrice">0</span></p>
            <button class="btn">Confirm Booking</button>
        </div>
    </div>

    <script>
        const seats = document.querySelectorAll(".seat:not(.booked)");
        const selectedSeatsText = document.getElementById("selectedSeats");
        const totalPriceText = document.getElementById("totalPrice");

        const seatPrice = 150;

        seats.forEach(seat => {
            seat.addEventListener("click", () => {
                seat.classList.toggle("selected");

                const selectedSeats = document.querySelectorAll(".seat.selected");
                const seatNumbers = [];

                selectedSeats.forEach(selectedSeat => {
                    seatNumbers.push(selectedSeat.innerText);
                });

                selectedSeatsText.innerText = seatNumbers.length > 0 ? seatNumbers.join(", ") : "None";
                totalPriceText.innerText = selectedSeats.length * seatPrice;
            });
        });
    </script>

</body>
</html>
